<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirms/Pēc Pārveidotājs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFBF0;
    --ink:#1A1A2E;
    --pink:#FF3E7F;
    --cyan:#00B4BD;
    --yellow:#FFD400;
    --purple:#7C3AED;
    --orange:#FF8A00;
    --green:#2FBF71;
    --white:#FFFFFF;
    --gray:#C9C9D4;
    --grayText:#6B6B7A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
 
  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    text-align:center;
    padding:34px 20px 28px;
    background:var(--orange);
    border-bottom:5px solid var(--ink);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.5) 1.4px, transparent 1.6px);
    background-size:16px 16px;
    pointer-events:none;
  }
  .eyebrow{
    position:relative;
    display:inline-block;
    font-weight:800;
    font-size:clamp(11px,2vw,13px);
    letter-spacing:2px;
    background:var(--ink);
    color:var(--yellow);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:14px;
  }
  h1{
    position:relative;
    font-family:'Bangers',cursive;
    font-weight:400;
    letter-spacing:2px;
    font-size:clamp(32px,7.5vw,52px);
    line-height:0.95;
    color:var(--white);
    -webkit-text-stroke:2.5px var(--ink);
    text-shadow:4px 4px 0 var(--ink);
    margin:0 0 12px;
    transform:rotate(-1deg);
  }
  .subtitle{
    position:relative;
    max-width:520px;
    margin:0 auto;
    font-weight:700;
    font-size:clamp(14px,2.4vw,17px);
    background:var(--white);
    display:inline-block;
    padding:8px 18px;
    border:3px solid var(--ink);
    border-radius:14px;
    box-shadow:4px 4px 0 var(--ink);
  }
 
  main{max-width:620px;margin:0 auto;padding:26px 18px 20px;}
 
  /* ---------- CATEGORY TABS ---------- */
  .cat-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:20px;
  }
  .cat-tab{
    cursor:pointer;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.5px;
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:999px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    gap:6px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    box-shadow:3px 3px 0 var(--ink);
  }
  .cat-tab:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}
  .cat-tab.active{ color:var(--white); transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
  .cat-tab .cat-icon{ font-size:15px; }
 
  /* ---------- DOT NAV ---------- */
  .dots-nav{
    display:flex;align-items:center;justify-content:center;
    gap:7px;margin-bottom:22px;flex-wrap:wrap;
  }
  .dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--white);
    border:2.5px solid var(--ink);
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .dot:hover{transform:scale(1.25);}
  .dot.active{background:var(--ink);transform:scale(1.3);}
 
  /* ---------- STAGE ---------- */
  .stage-wrap{
    position:relative;
    min-height:340px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }
  .scene-card{
    position:relative;
    width:100%;
    max-width:400px;
    min-height:320px;
  }
 
  /* BEFORE (deliberately plain/boring) */
  .before-view{
    background:var(--white);
    border:2px solid var(--gray);
    border-radius:10px;
    padding:40px 24px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  .before-view.vanish{
    animation:vanishOut .28s ease forwards;
  }
  @keyframes vanishOut{
    to{ opacity:0; transform:scale(0.7) rotate(-6deg); }
  }
  .before-icon{
    font-size:44px;
    display:block;
    margin-bottom:18px;
    filter:grayscale(70%);
    opacity:.75;
  }
  .before-label{
    font-weight:800;
    font-size:11px;
    letter-spacing:2px;
    color:var(--grayText);
    margin-bottom:10px;
  }
  .before-caption{
    font-weight:600;
    font-size:14.5px;
    color:var(--grayText);
  }
 
  /* AFTER (loud, comic, exploded) */
  .after-view{
    position:relative;
    border:5px solid var(--ink);
    border-radius:24px;
    padding:38px 24px 30px;
    text-align:center;
    overflow:hidden;
  }
  .after-view.pattern-dots::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.45) 1.4px, transparent 1.6px);
    background-size:14px 14px;
    pointer-events:none;
  }
  .after-view.pattern-stripes::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.28) 0 8px, transparent 8px 18px);
    pointer-events:none;
  }
  .after-view.pattern-grid::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.28) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(255,255,255,.28) 1.5px, transparent 1.5px);
    background-size:20px 20px;
    pointer-events:none;
  }
  .after-view.enter{
    animation:explodeIn .5s cubic-bezier(.22,1.6,.4,1) both;
  }
  @keyframes explodeIn{
    0%{ opacity:0; transform:scale(.3) rotate(12deg); }
    55%{ opacity:1; transform:scale(1.12) rotate(-4deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
 
  .burst{
    position:absolute;
    top:50%; left:50%;
    width:260px; height:260px;
    transform:translate(-50%,-50%) scale(0) rotate(0deg);
    background:var(--white);
    opacity:.5;
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    z-index:0;
  }
  .after-view.enter .burst{
    animation:burstPop .6s ease-out both;
  }
  @keyframes burstPop{
    0%{ transform:translate(-50%,-50%) scale(0) rotate(0deg); opacity:.9; }
    70%{ transform:translate(-50%,-50%) scale(1.15) rotate(35deg); opacity:.55; }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(25deg); opacity:.35; }
  }
 
  .after-icon{
    position:relative;
    z-index:2;
    font-size:60px;
    display:block;
    margin-bottom:8px;
  }
  .after-view.enter .after-icon{
    animation:iconWiggle .6s ease .1s both;
  }
  @keyframes iconWiggle{
    0%{ transform:scale(.4) rotate(0deg); }
    50%{ transform:scale(1.25) rotate(-10deg); }
    75%{ transform:scale(1.05) rotate(6deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
 
  .action-fx{
    position:relative;
    z-index:2;
    display:inline-block;
    font-family:'Bangers',cursive;
    font-size:clamp(22px,6vw,30px);
    letter-spacing:1px;
    color:var(--yellow);
    -webkit-text-stroke:2px var(--ink);
    margin-bottom:10px;
    transform:rotate(-4deg) scale(0);
  }
  .after-view.enter .action-fx{
    animation:stampIn .4s cubic-bezier(.3,1.6,.4,1) .25s both;
  }
  @keyframes stampIn{
    to{ transform:rotate(-4deg) scale(1); }
  }
 
  .after-label{
    position:relative;
    z-index:2;
    display:inline-block;
    font-weight:800;
    font-size:11px;
    letter-spacing:2px;
    color:var(--white);
    background:var(--ink);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .after-caption{
    position:relative;
    z-index:2;
    font-family:'Bangers',cursive;
    font-size:clamp(17px,4.2vw,21px);
    letter-spacing:.5px;
    text-shadow:2px 2px 0 var(--ink);
    line-height:1.25;
  }
 
  .confetti-dot{
    position:absolute;
    top:50%; left:50%;
    width:9px; height:9px;
    border-radius:2px;
    z-index:1;
    opacity:0;
  }
  .after-view.enter .confetti-dot{
    animation:confettiFly .7s ease-out both;
  }
  @keyframes confettiFly{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1) translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(.6) translate(var(--dx),var(--dy)) rotate(var(--dr)); }
  }
 
  /* ---------- TRANSFORM BUTTON ---------- */
  .transform-wrap{ text-align:center; margin-bottom:26px; }
  #transformBtn{
    font-family:'Bangers',cursive;
    letter-spacing:1.5px;
    font-size:clamp(19px,4.4vw,24px);
    color:var(--white);
    background:var(--purple);
    border:4px solid var(--ink);
    border-radius:999px;
    padding:14px 38px;
    cursor:pointer;
    box-shadow:6px 6px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #transformBtn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink);}
  #transformBtn:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink);}
  #transformBtn.is-after{ background:var(--cyan); }
 
  /* ---------- NAV ---------- */
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .nav-btn{
    font-family:'Bangers',cursive;
    letter-spacing:1px;
    font-size:15px;
    color:var(--ink);
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:999px;
    padding:10px 18px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .nav-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
 
  footer.ethics-banner{
    text-align:center;
    font-weight:800;
    font-size:clamp(13px,2.6vw,15px);
    background:var(--yellow);
    border-top:5px solid var(--ink);
    padding:16px 20px 22px;
    margin-top:20px;
  }
 
  @media (max-width:420px){
    .scene-card{ min-height:300px; }
  }
</style>
</head>
<body>
 
<div class="hero">
  <span class="eyebrow">8.3 · HUMORS PLAKĀTĀ</span>
  <h1>PIRMS / PĒC<br>PĀRVEIDOTĀJS</h1>

<footer class="ethics-banner">

      {icon:'🧪', before:'Eksperiments. Maisi vielas.', after:'MAZĀ LABORATORIJA! Katrs mēģinājums — jauns atklājums!', verb:'MAISI!'},
      {icon:'🎵', before:'Mierīga mūzika. Skan klusi fonā.', after:'MIERA OKEĀNS AUSĪS! Nomierina pat pēc visraibākās dienas!', verb:'KLAUSIES!'},
      {icon:'⚽', before:'Treniņš. Kusties stundu.', after:'ENERĢIJAS VULKĀNS! Pēc treniņa vari pārcelt kalnus!', verb:'SKRIEN!'},
      {icon:'🏆', before:'Olimpiāde. Piedalies sacensībā.', after:'ZINĀŠANU ARĒNA! Kur ikdienas gudrinieki kļūst par čempioniem!', verb:'UZVARI!'}
    ]
  }
];
 
let catIdx = 0;
let idx = 0;
let isAfter = false;
 
const catTabs = document.getElementById('catTabs');
const dotsNav = document.getElementById('dotsNav');
const sceneCard = document.getElementById('sceneCard');
const transformBtn = document.getElementById('transformBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
 
function buildTabs(){
  catTabs.innerHTML = '';
  categories.forEach((c,i)=>{
    const t = document.createElement('div');
    t.className = 'cat-tab';
    t.innerHTML = `<span class="cat-icon">${c.icon}</span>${c.label}`;
    t.addEventListener('click', ()=>{
      catIdx = i; idx = 0; isAfter = false;
      buildDots(); render();
      updateTabs();
    });
    catTabs.appendChild(t);
  });
  updateTabs();
}
 
function updateTabs(){
  const tabs = catTabs.querySelectorAll('.cat-tab');
  tabs.forEach((t,i)=>{
    if(i === catIdx){
      t.classList.add('active');
      t.style.background = categories[i].color;
    } else {
      t.classList.remove('active');
      t.style.background = 'var(--white)';
    }
  });
}
 
function buildDots(){
  dotsNav.innerHTML = '';
  categories[catIdx].items.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.addEventListener('click', ()=>{ idx = i; isAfter = false; render(); });
    dotsNav.appendChild(d);
  });
  updateDots();
}
 
function updateDots(){
  const dots = dotsNav.querySelectorAll('.dot');
  dots.forEach((d,i)=> d.classList.toggle('active', i === idx));
}
 
function confettiHTML(color){
  const colors = [color, '#FFD400', '#FFFFFF'];
  let html = '';
  for(let i=0;i<12;i++){
    const angle = (Math.PI*2 / 12) * i + (Math.random()*0.4 - 0.2);
    const dist = 90 + Math.random()*50;
    const dx = Math.round(Math.cos(angle)*dist);
    const dy = Math.round(Math.sin(angle)*dist);
    const dr = Math.round(Math.random()*360 - 180);
    const c = colors[i % colors.length];
    const delay = (Math.random()*0.08).toFixed(2);
    html += `<span class="confetti-dot" style="background:${c};--dx:${dx}px;--dy:${dy}px;--dr:${dr}deg;animation-delay:${delay}s;"></span>`;
  }
  return html;
}
 
function render(){
  updateDots();
  const item = categories[catIdx].items[idx];
  const paletteEntry = PALETTE[(catIdx*2 + idx) % PALETTE.length];
  const pattern = PATTERNS[idx % PATTERNS.length];
  const stampColor = paletteEntry.bg === '#FFD400' ? '#FFFFFF' : '#FFD400';
 
  if(!isAfter){
    sceneCard.innerHTML = `
      <div class="before-view" id="beforeView">
        <span class="before-icon">${item.icon}</span>
        <div class="before-label">PIRMS</div>
        <div class="before-caption">${item.before}</div>
      </div>
    `;
    transformBtn.textContent = '⚡ PĀRVEIDOT!';
    transformBtn.classList.remove('is-after');
  } else {
    sceneCard.innerHTML = `
      <div class="after-view ${pattern}" id="afterView" style="background:${paletteEntry.bg};color:${paletteEntry.text}">
        <div class="burst"></div>
        ${confettiHTML(paletteEntry.bg)}
        <span class="after-icon">${item.icon}</span>
        <div class="action-fx" style="color:${stampColor}">${item.verb}</div>
        <div class="after-label">PĒC</div>
        <div class="after-caption">${item.after}</div>
      </div>
    `;
    transformBtn.textContent = '↺ RĀDĪT PIRMS';
    transformBtn.classList.add('is-after');
  }
}
 
function playTransformIn(){
  const el = document.getElementById('afterView');
  if(el){
    el.classList.remove('enter');
    void el.offsetWidth;
    el.classList.add('enter');
  }
}
 
transformBtn.addEventListener('click', ()=>{
  isAfter = !isAfter;
  render();
  if(isAfter) playTransformIn();
});
 
prevBtn.addEventListener('click', ()=>{
  const n = categories[catIdx].items.length;
  idx = (idx - 1 + n) % n;
  isAfter = false;
  render();
});
 
nextBtn.addEventListener('click', ()=>{
  const n = categories[catIdx].items.length;
  idx = (idx + 1) % n;
  isAfter = false;
  render();
});
 
buildTabs();
buildDots();
render();
</script>
 
</body>
</html>
